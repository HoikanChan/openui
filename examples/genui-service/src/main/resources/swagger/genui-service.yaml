swagger: "2.0"
info:
  title: GenUI Service API
  version: 0.1.0-SNAPSHOT
  description: |
    GenUI Service —— Java Generation SDK 的 REST 参考实现(SmartCanvasService 契约)。

    - generations / prompts 端点由 swagger-codegen 生成接口,手写 Controller 实现。
    - /generate 为手写流式实现(text/event-stream, Server-Sent Events),本文档中仅作契约声明;
      codegen 生成的接口签名无法表达流式,故该接口不被实现。每个 SSE `data:` 行是一个 JSON
      RenderStreamEnvelope 帧(dataModel/dsl/error/done)。
basePath: /v1
# 不设全局 consumes:codegen 会把它刻进 GET 映射,导致无 Content-Type 的 GET 请求 415
schemes:
  - http
produces:
  - application/json
tags:
  - name: generations
    description: Generation 注册与查询(Extension Registration)
  - name: prompts
    description: Prompt 拼装(Request Overlay 支持)
  - name: generation
    description: openui-lang 生成(LLM 流式)
  - name: tools
    description: 工具执行通道(Query/Mutation 的服务端运行时)

paths:
  /generations:
    get:
      tags:
        - generations
      operationId: listGenerations
      summary: 列出已注册的 Generation
      description: 返回全部已注册扩展的摘要(含启动种子注册的预制扩展)。注册不持久化,服务重启后仅种子恢复。
      responses:
        200:
          description: 已注册 Generation 摘要列表
          schema:
            type: array
            items:
              $ref: "#/definitions/GenerationSummary"

  /generations/{extensionId}:
    put:
      tags:
        - generations
      operationId: registerGeneration
      summary: 注册或整体替换一个 Extension Registration
      description: 替换语义:同一 extensionId 重复注册将整体替换原扩展契约(幂等)。与 base contract 或扩展自身的组件名/工具名碰撞将被拒绝。
      consumes:
        - application/json
      parameters:
        - name: extensionId
          in: path
          required: true
          type: string
          description: Generation ID,隔离一个业务注册
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/ExtensionRegistration"
      responses:
        200:
          description: 注册/替换成功
          schema:
            $ref: "#/definitions/GenerationSummary"
        400:
          description: 非法输入(如组件组引用不存在的组件)
          schema:
            $ref: "#/definitions/ErrorResponse"
        409:
          description: Contract Name Collision(组件名或工具名与现有契约碰撞)
          schema:
            $ref: "#/definitions/ErrorResponse"

  /prompts/assemble:
    post:
      tags:
        - prompts
      operationId: assemblePrompt
      summary: 拼装 system prompt
      description: extensionId 缺省时仅使用 base contract。extraRules 为请求级附加规则:仅作用于本次拼装,不持久化。
      consumes:
        - application/json
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/AssembleRequest"
      responses:
        200:
          description: 拼装产物与元数据
          schema:
            $ref: "#/definitions/AssembleResult"
        400:
          description: 非法输入
          schema:
            $ref: "#/definitions/ErrorResponse"
        404:
          description: extensionId 未注册
          schema:
            $ref: "#/definitions/ErrorResponse"

  /generate:
    post:
      tags:
        - generation
      operationId: generate
      summary: 生成 openui-lang(SSE 流式,SDK 校验门包络)
      description: |
        以 Server-Sent Events(text/event-stream)流式返回 SDK 校验门包络帧。手写实现,不经 codegen。

        每个 SSE `data:` 行是一个 JSON RenderStreamEnvelope {type, seq, content}:
        - `dataModel`(seq=0):首帧,回显请求的 dataModel(content 为 JSON 对象)。
        - `dsl`(seq 递增):经 SDK 校验门放行、可安全渲染的 openui-lang 内容(一条完整语句,
          content 为字符串);**不是** LLM 原始增量,未通过校验门的语句永不出现在此帧。
        - `error`:SDK 判定无法产出可信 DSL(content 为 {code, message, retryable})。
          code=VALIDATION_FAILED 表示某完整语句被校验门 withhold(retryable=false);
          code=LLM_STREAM_FAILED 表示流中途失败或 finish_reason 非 stop(retryable=true)。
        - `done`:流结束(无 content 字段),仅表示 SSE 结束,不承载业务成功语义。

        错误边界:拼装/连接在响应体开始前失败仍返回 JSON(400/404/502),任何 SSE 帧都在
        LLM 连接成功之后;流中途或 finish_reason 非 stop 改为发 error 帧(取代旧的 "[ERROR: ...]" 文本尾巴)。
      consumes:
        - application/json
      produces:
        - text/event-stream
      parameters:
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/GenerateRequest"
      responses:
        200:
          description: |
            RenderStreamEnvelope 帧的 SSE 流(text/event-stream)。每行 `data: <json>`,
            帧类型见 RenderStreamEnvelope 定义;首帧 dataModel(seq=0),末帧 done。
          schema:
            $ref: "#/definitions/RenderStreamEnvelope"
        400:
          description: prompt 为空等非法输入
          schema:
            $ref: "#/definitions/ErrorResponse"
        404:
          description: extensionId 未注册
          schema:
            $ref: "#/definitions/ErrorResponse"
        502:
          description: LLM 调用在产生首个 token 前失败
          schema:
            $ref: "#/definitions/ErrorResponse"

  /tools/{toolName}/execute:
    post:
      tags:
        - tools
      operationId: executeTool
      summary: 执行一个工具,返回结果 JSON
      description: |
        生成的 openui-lang 中的 Query/Mutation 节点由前端 Renderer 的 toolProvider
        转发到此端点执行。参考实现内置种子工具(queryAlarms/acknowledgeAlarm)的
        mock 执行器;公司内部落地时在此接入真实工具通道。
      consumes:
        - application/json
      parameters:
        - name: toolName
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          description: 工具入参(对应 ToolSpec.inputSchema)
          schema:
            type: object
            additionalProperties: true
      responses:
        200:
          description: 工具执行结果
          schema:
            type: object
            additionalProperties: true
        404:
          description: 工具未注册执行器
          schema:
            $ref: "#/definitions/ErrorResponse"

definitions:
  GenerationSummary:
    type: object
    properties:
      extensionId:
        type: string
      version:
        type: string
        description: 扩展契约版本(Contract Version)
      componentCount:
        type: integer
        format: int32
      toolCount:
        type: integer
        format: int32

  ComponentPromptSpec:
    type: object
    description: 模型可见的组件契约;优先 propsSchema,signature 为迁移期兼容回退
    properties:
      description:
        type: string
      propsSchema:
        type: object
        description: 组件 props 的 JSON Schema,属性顺序敏感(影响 prompt 字节对齐)
        additionalProperties: true
      signature:
        type: string
        description: 旧形态签名;仅当 propsSchema 缺省时回退使用

  ComponentGroup:
    type: object
    properties:
      name:
        type: string
      components:
        type: array
        items:
          type: string
      notes:
        type: array
        items:
          type: string

  ToolAnnotations:
    type: object
    properties:
      readOnlyHint:
        type: boolean
      destructiveHint:
        type: boolean

  ToolSpec:
    type: object
    required:
      - name
    properties:
      name:
        type: string
      description:
        type: string
      inputSchema:
        type: object
        description: JSON Schema,属性顺序敏感(影响 prompt 字节对齐)
        additionalProperties: true
      outputSchema:
        type: object
        additionalProperties: true
      annotations:
        $ref: "#/definitions/ToolAnnotations"

  ExtensionRegistration:
    type: object
    description: Extension Registration:仅含下游扩展契约,base contract 由服务内置提供
    properties:
      version:
        type: string
        description: 扩展契约版本(Contract Version)
      components:
        type: object
        description: 组件名 → 组件契约;名称不得与 base contract 碰撞
        additionalProperties:
          $ref: "#/definitions/ComponentPromptSpec"
      componentGroups:
        type: array
        items:
          $ref: "#/definitions/ComponentGroup"
      tools:
        type: array
        items:
          $ref: "#/definitions/ToolSpec"
      examples:
        type: array
        items:
          type: string
      additionalRules:
        type: array
        items:
          type: string

  DataModel:
    type: object
    properties:
      description:
        type: string
      raw:
        type: object
        description: 原始数据模型(任意 JSON 对象)
        additionalProperties: true

  AssembleRequest:
    type: object
    properties:
      extensionId:
        type: string
        description: 缺省时仅使用 base contract
      dataModel:
        $ref: "#/definitions/DataModel"
      extraRules:
        type: array
        description: 请求级附加规则,仅本次拼装生效,不持久化
        items:
          type: string
      editMode:
        type: boolean
      inlineMode:
        type: boolean
      toolCalls:
        type: boolean
      bindings:
        type: boolean

  AssemblyMetadata:
    type: object
    properties:
      extensionId:
        type: string
      baseContractVersion:
        type: string
      generationVersion:
        type: string
      registeredToolNames:
        type: array
        items:
          type: string

  AssembleResult:
    type: object
    properties:
      prompt:
        type: string
      metadata:
        $ref: "#/definitions/AssemblyMetadata"

  GenerateRequest:
    type: object
    required:
      - prompt
    properties:
      prompt:
        type: string
        description: 用户生成诉求(user message)
      extensionId:
        type: string
      dataModel:
        type: object
        description: 原始数据模型,等价 DataModel.raw
        additionalProperties: true
      extraRules:
        type: array
        description: 请求级附加规则,仅本次拼装生效
        items:
          type: string
      promptOverride:
        type: string
        description: |
          Prompt Override(debug-only):有值时整段替换 SDK 拼装产物,绕过 Generation。
          仅供调试实验,生产调用方不应使用。与请求级 extraRules(仅追加)语义严格区分。

  StreamEnvelopeError:
    type: object
    description: error 帧的 content
    properties:
      code:
        type: string
        description: VALIDATION_FAILED(语句被校验门 withhold)| LLM_STREAM_FAILED(流中途失败/截断)
      message:
        type: string
      retryable:
        type: boolean

  RenderStreamEnvelope:
    type: object
    description: |
      /generate SSE 流的单帧,序列化为一行 `data: <json>`。content 的 JSON 类型由 type 决定:
      dataModel→对象;dsl→字符串;error→StreamEnvelopeError;done→省略 content。
    required:
      - type
      - seq
    properties:
      type:
        type: string
        description: dataModel | dsl | error | done
        enum:
          - dataModel
          - dsl
          - error
          - done
      seq:
        type: integer
        format: int32
        description: 帧序号,首帧 dataModel 为 0,其后单调递增
      content:
        type: object
        description: |
          按 type 变化的载荷:dataModel 为原始数据模型对象;dsl 为已放行的 openui-lang 字符串;
          error 为 StreamEnvelopeError;done 无此字段。
        additionalProperties: true

  ErrorResponse:
    type: object
    properties:
      error:
        type: string
