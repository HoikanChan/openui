name: Java Lint

on:
  push:
    branches: [master]
    paths:
      - "packages/genui-java-sdk/**"
      - "packages/genui-eval-cli/**"
      - "config/checkstyle/**"
      - "config/spotbugs/**"
      - "config/pmd/**"
      - "tools/lint-rules/**"
      - "tools/lint-regression/**"
      - "pom.xml"
      - ".github/workflows/java-lint.yml"
  pull_request:
    paths:
      - "packages/genui-java-sdk/**"
      - "packages/genui-eval-cli/**"
      - "config/checkstyle/**"
      - "config/spotbugs/**"
      - "config/pmd/**"
      - "tools/lint-rules/**"
      - "tools/lint-regression/**"
      - "pom.xml"
      - ".github/workflows/java-lint.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Checkstyle / SpotBugs / PMD / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # genui-core 以 provided 依赖 BSP restclient；该内部构件不在 Maven Central，
      # 用仓库自带的离线 stub（bsp-stub/）安装到本地仓库后再构建。
      - name: Install BSP restclient stub
        working-directory: packages/genui-java-sdk/bsp-stub
        run: |
          mkdir -p target/classes
          javac -encoding UTF-8 -d target/classes $(find src -name '*.java')
          jar --create --file target/com.huawei.bsp.commonlib.resetclient-25.590.54.jar \
            -C target/classes .
          mvn -B install:install-file \
            -Dfile=target/com.huawei.bsp.commonlib.resetclient-25.590.54.jar \
            -DgroupId=com.huawei.bsp \
            -DartifactId=com.huawei.bsp.commonlib.resetclient \
            -Dversion=25.590.54 \
            -Dpackaging=jar

      # verify 阶段绑定四项检查：checkstyle、spotbugs、PMD、fmt。
      # 只跑静态检查，跳过测试；测试仍由本地或后续的 test workflow 执行。
      - name: Run lint checks
        run: mvn -B -DskipTests verify

  regression:
    name: Lint rule regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 正反例覆盖 6 条 Checkstyle 规则与 3 条 PMD 语义规则；脚本自行安装规则 jar。
      - name: Run fixture regression
        run: python3 tools/lint-regression/run_regression.py
