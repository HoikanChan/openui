name: Java Lint

on:
  push:
    branches: [master]
    paths:
      - "packages/genui-java-sdk/**"
      - "packages/genui-eval-cli/**"
      - "config/checkstyle/**"
      - "config/spotbugs/**"
      - "pom.xml"
      - ".github/workflows/java-lint.yml"
  pull_request:
    paths:
      - "packages/genui-java-sdk/**"
      - "packages/genui-eval-cli/**"
      - "config/checkstyle/**"
      - "config/spotbugs/**"
      - "pom.xml"
      - ".github/workflows/java-lint.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Checkstyle / SpotBugs / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # verify 阶段绑定三项检查：checkstyle、spotbugs、fmt。
      # 只跑静态检查，跳过测试；测试仍由本地或后续的 test workflow 执行。
      - name: Run lint checks
        run: mvn -B -DskipTests verify
