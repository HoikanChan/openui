name: Java CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Java changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.eval.outputs.changed }}
    steps:
      - name: Checkout repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Evaluate path filter
        id: eval
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BASE_SHA" || true
          fi
          if ! FILES=$(git diff --name-only "${BASE_SHA}...HEAD" 2>/dev/null); then
            echo "Diff failed, running Java CI conservatively."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$FILES" | grep -Eq '^(packages/genui-java-sdk/|packages/genui-eval-langsmith/|packages/genui-eval-cli/|config/(checkstyle|spotbugs|pmd)/|tools/(lint-rules|lint-regression)/|pom\.xml$|\.github/workflows/java-lint\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Tests & Lint (verify)
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # genui-core 以 provided 依赖 BSP restclient；该内部构件不在 Maven Central，
      # 用仓库自带的离线 stub（bsp-stub/）安装到本地仓库后再构建。
      - name: Install BSP restclient stub
        working-directory: packages/genui-java-sdk/bsp-stub
        run: |
          mkdir -p target/classes
          javac -encoding UTF-8 -d target/classes $(find src -name '*.java')
          jar --create --file target/com.huawei.bsp.commonlib.resetclient-25.590.54.jar \
            -C target/classes .
          mvn -B install:install-file \
            -Dfile=target/com.huawei.bsp.commonlib.resetclient-25.590.54.jar \
            -DgroupId=com.huawei.bsp \
            -DartifactId=com.huawei.bsp.commonlib.resetclient \
            -Dversion=25.590.54 \
            -Dpackaging=jar

      # verify 阶段绑定全量测试与四项静态检查：surefire、checkstyle、spotbugs、PMD、fmt。
      - name: Run tests and lint checks
        run: mvn -B verify

  regression:
    name: Lint rule regression
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 正反例覆盖 6 条 Checkstyle 规则与 3 条 PMD 语义规则；脚本自行安装规则 jar。
      - name: Run fixture regression
        run: python3 tools/lint-regression/run_regression.py

  gate:
    name: Java CI Gate
    needs: [changes, verify, regression]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Java CI gate
        shell: bash
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Change detection failed: ${{ needs.changes.result }}"
            exit 1
          fi
          if [ "${{ needs.changes.outputs.changed }}" != "true" ]; then
            echo "No Java/lint files changed; gate passed without running Maven."
            exit 0
          fi
          if [ "${{ needs.verify.result }}" != "success" ] || [ "${{ needs.regression.result }}" != "success" ]; then
            echo "Java CI failed: verify=${{ needs.verify.result }}, regression=${{ needs.regression.result }}"
            exit 1
          fi
          echo "Java CI Gate passed."
